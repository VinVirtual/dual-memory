name: minilm-benchmark

# Slow job: downloads the pinned MiniLM model and re-runs the headline benchmark.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minilm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install (pinned)
        run: python -m pip install -r requirements-ci.txt -r requirements-onnx.txt -e .
      - name: ONNX tests (model downloaded at the pinned revision and hash-checked)
        run: |
          python -c "from dual_memory import OnnxEmbedder; OnnxEmbedder()"
          pytest tests/test_embedders.py
      - name: MiniLM benchmark reproduces the committed results
        run: |
          dual-memory bench --data examples/benchmark/data.json --out /tmp/minilm --embedder onnx --budget 256 --no-chart
          python scripts/compare_results.py /tmp/minilm/results.json examples/benchmark/minilm/results.json
