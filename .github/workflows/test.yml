name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned tools)
        run: python -m pip install -r requirements-ci.txt -e .
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Unit tests
        # The ONNX embedder tests need onnxruntime and a downloaded model; they are skipped here.
        # tests/test_bench.py::test_stub_benchmark_is_reproducible checks a hash of every stub answer.
        run: pytest --cov=dual_memory --cov-report=term
      - name: Hashing benchmark reproduces the committed results
        run: |
          dual-memory bench --data examples/benchmark/data.json --out /tmp/hashing --embedder hashing --budget 256 --no-chart
          python scripts/compare_results.py /tmp/hashing/results.json examples/benchmark/hashing/results.json
