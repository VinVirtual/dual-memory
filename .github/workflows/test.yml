name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Unit tests
        # The ONNX embedder test needs a downloaded model and is skipped here.
        run: pytest --cov=dual_memory --cov-report=term
      - name: Benchmark smoke run (stub mode, hashing embedder)
        run: |
          dual-memory generate --out /tmp/bench.json --personas 4 --sessions 6
          dual-memory bench --data /tmp/bench.json --out /tmp/bench-out --budgets 128,256
